<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경북교육지도</title>
<meta name="description" content="경상북도 초·중·고·특수학교 925곳의 학생 수 변화, 작은학교, 도서벽지, 폐교, 통학 거리를 3D 지도로 보는 교사용 교육 통계 지도">
<meta property="og:title" content="경북교육지도">
<meta property="og:description" content="경북 학교 925곳 · 학생 수 5년 변화 · 작은학교 · 도서벽지 · 폐교 · 통학 거리를 3D 지도로">
<meta property="og:type" content="website">
<meta property="og:image" content="https://kimju1416.github.io/gb-edu-map/og.jpg">
<meta property="og:url" content="https://kimju1416.github.io/gb-edu-map/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F5F3EE">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2323704A'/%3E%3Cpath d='M5 24l7-10 5 6 4-5 6 9z' fill='%23F5F3EE'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
:root{
  --pt:#23704A; --pt-h:#1B5A3B; --pt-soft:#E6F0E9; --pt-line:#BFD8C6;
  --bg:#F5F3EE; --card:#FFFFFF; --line:#E4E0D6; --line-2:#D6D1C4;
  --tx:#1F2A24; --tx-2:#5A635C; --tx-3:#6F766F;
  --warn:#B26B0F; --bad:#C0392B;
  --k-e:#2E8B57; --k-m:#2F6DB5; --k-h:#9C2F6E; --k-s:#1A9AA8;
  --r1:8px; --r2:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06); --float:0 6px 24px rgba(31,42,36,.14);
  --top:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- 상단 ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:20px;padding:0 16px 0 18px;background:var(--bg);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;background:none;border:0;padding:0}
.brand svg{flex:none}
.kpis{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.kpis::-webkit-scrollbar{display:none}
.kpi{padding:0 16px;border-left:1px solid var(--line);white-space:nowrap;display:flex;flex-direction:column;justify-content:center;background:none;border-top:0;border-bottom:0;border-right:0;text-align:left}
.kpi:first-child{border-left:0}
.kpi b{font-size:16px;font-weight:700}
.kpi small{font-size:12px;color:var(--tx-2);font-weight:500}
.kpi em{font-style:normal;font-size:11.5px;font-weight:600;margin-left:4px;color:var(--bad)}
.kpi.btn:hover b{color:var(--pt)}
.top-r{display:flex;gap:8px;align-items:center;white-space:nowrap}
.ref{font-size:12px;color:var(--tx-3)}
.tbtn{height:34px;padding:0 12px;border-radius:var(--r1);border:1px solid var(--line-2);background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--pt);color:var(--pt)}
.tbtn.pri{background:var(--pt);color:#fff;border-color:var(--pt)}
.tbtn.pri:hover{background:var(--pt-h);color:#fff}

/* ---------- 왼쪽 패널 ---------- */
.panel{position:fixed;top:var(--top);left:0;bottom:0;width:408px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
.ptabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);flex:none}
.ptab{border:0;background:none;padding:9px 12px 11px;font-size:14.5px;font-weight:600;color:var(--tx-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab[aria-selected=true]{color:var(--pt);border-bottom-color:var(--pt)}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 40px}
.sheet-handle{display:none}
.sec-l{font-size:12.5px;font-weight:600;color:var(--tx-2);letter-spacing:.02em;margin:22px 0 8px}
.sec-l:first-child{margin-top:0}
.muted{color:var(--tx-2)}
.small{font-size:13px}
.back{border:0;background:none;padding:0;color:var(--pt);font-size:13.5px;font-weight:600;margin-bottom:14px}
.back:hover{text-decoration:underline}

/* 질문 목록 */
.intro{margin:-18px -20px 16px;position:relative;height:150px;overflow:hidden;border-bottom:1px solid var(--line);background:#EEEBE3}
.intro img{width:100%;height:100%;object-fit:cover;display:block}
.intro p{position:absolute;left:18px;bottom:12px;right:18px;margin:0;font-size:13px;line-height:1.5;color:var(--tx);background:rgba(255,255,255,.86);padding:8px 10px;border-radius:var(--r1)}
.qgroup{font-size:12.5px;font-weight:600;color:var(--tx-2);margin:20px 0 4px}
.qrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:12px 4px;border-bottom:1px solid var(--line)}
.qrow:hover .qt{color:var(--pt)}
.qn{flex:none;width:22px;height:22px;border-radius:6px;background:var(--pt-soft);color:var(--pt);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.qt{font-size:15px;font-weight:600;line-height:1.45}
.qs{font-size:12.5px;color:var(--tx-2);margin-top:3px;line-height:1.45}

/* 질문 상세 */
.cat{font-size:12.5px;font-weight:600;color:#8A4B1E;margin-bottom:6px}
h2.q{font-size:21px;line-height:1.4;margin:0 0 16px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--pt)}
.chip[aria-pressed=true]{background:var(--pt-soft);border-color:var(--pt-line);color:var(--pt);font-weight:600}
.hero{margin:16px 0 12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r2);background:#FAF9F6}
.hero .l{font-size:12.5px;color:var(--tx-2)}
.hero .v{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.hero .v small{font-size:13px;color:var(--tx-2);font-weight:500;margin-left:3px}
.hero .d{font-size:12px;color:var(--tx-3)}
.story p{font-size:14.5px;line-height:1.7;margin:0 0 10px}
.story p b{font-weight:700}
.note{font-size:12.5px;line-height:1.6;color:var(--tx-2);background:#FAF9F6;border-left:3px solid var(--line-2);padding:8px 10px;margin:12px 0}

/* 순위 막대 */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:18px 1fr 64px;align-items:center;gap:8px;padding:6px 2px;font-size:13.5px;border-radius:6px;cursor:pointer}
.rank li:hover{background:#F6F4EF}
.rank li.on{background:var(--pt-soft)}
.rank .sw{width:10px;height:10px;border-radius:3px}
.rank .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.rank .bar{height:5px;border-radius:0 3px 3px 0;background:#CFC9BB;min-width:2px}
.rank .v{text-align:right;font-weight:600}
.rank .tag{font-size:12px;color:#8A4B1E;font-weight:600;margin-left:4px}

/* 검색 */
.search{position:relative}
.search input{width:100%;height:46px;border:1px solid var(--line-2);border-radius:var(--r1);padding:0 14px 0 40px;font-size:15px;background:var(--card)}
.search input:focus{border-color:var(--pt);box-shadow:0 0 0 3px rgba(35,112,74,.12);outline:0}
.search svg{position:absolute;left:13px;top:14px;color:var(--tx-3)}
.frow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
select.sel{height:34px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--card);padding:0 8px;font-size:13px}
.slist{list-style:none;margin:10px 0 0;padding:0}
.slist li{border-bottom:1px solid var(--line)}
.slist button{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:11px 2px;text-align:left}
.slist button:hover .sn{color:var(--pt)}
.dot{width:10px;height:10px;border-radius:50%}
.sn{font-size:14.5px;font-weight:600}
.sm{font-size:12px;color:var(--tx-2);margin-top:2px}
.sv{font-size:13px;font-weight:600;text-align:right}
.sv small{display:block;font-weight:500;color:var(--tx-3);font-size:11.5px}
.more{width:100%;margin-top:10px}
.count{font-size:12.5px;color:var(--tx-2);margin-top:12px}

/* 학교 카드 */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:#F1EFE9;color:var(--tx-2);font-weight:500}
.tag.bj{background:#FBF0DE;color:#8A4B1E;font-weight:600}
.tag.k{color:#fff;font-weight:600}
h2.sch{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.sub{font-size:13px;color:var(--tx-2);margin-top:4px}
.grid5{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r2);margin-top:16px;overflow:hidden}
.grid5>div{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid5>div:nth-child(3n){border-right:0}
.grid5>div:nth-last-child(-n+3){border-bottom:0}
.grid5 .l{font-size:12px;color:var(--tx-2)}
.grid5 .v{font-size:19px;font-weight:700;margin-top:2px}
.grid5 .v small{font-size:12px;color:var(--tx-2);font-weight:500;margin-left:2px}
.cmp{display:grid;grid-template-columns:92px 1fr 56px;gap:10px;align-items:center;font-size:13px;padding:7px 0}
.cmp .track{position:relative;height:18px}
.cmp .track::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:#E7E3DA;border-radius:2px}
.cmp .mid{position:absolute;top:2px;width:2px;height:14px;background:var(--tx-3)}
.cmp .me{position:absolute;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pt);border:2px solid #fff;box-shadow:0 0 0 1px var(--pt);transform:translateX(-5px)}
.cmp .v{text-align:right;font-weight:600}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13.5px;line-height:1.5}
.kv dt{color:var(--tx-2)}
.kv dd{margin:0}
.kv a{color:var(--pt)}
.meal{font-size:13.5px;line-height:1.7;margin:0}
.evs{list-style:none;margin:0;padding:0;font-size:13.5px}
.evs li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.evs li span:first-child{color:var(--tx-2);width:74px;flex:none}
.skel{color:var(--tx-3);font-size:13px}
svg.chart text{font-family:inherit}

/* 시군 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--tx-2);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line-2)}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl td:first-child{text-align:left;font-weight:600}
.tbl tr{cursor:pointer}
.tbl tr:hover td{background:#F6F4EF}

/* ---------- 지도 ---------- */
#map{position:fixed;top:var(--top);left:408px;right:0;bottom:0;background:#EEF1EE}
.ctl-ind{position:fixed;top:calc(var(--top) + 12px);left:420px;right:250px;z-index:7;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ctl-ind>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:3px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--tx-2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--tx);color:#fff;font-weight:600}
.seg.kinds button[aria-pressed=true]{background:var(--pt)}
.seg.dim button{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inddd{position:relative}
.inddd>button{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--card);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.inddd .menu{position:absolute;top:42px;left:0;width:320px;max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r2);box-shadow:var(--float);padding:8px;display:none}
.inddd.open .menu{display:block;z-index:30}
body.menu-open .legend{visibility:hidden}
.menu h4{font-size:11.5px;color:var(--tx-3);font-weight:600;margin:8px 8px 4px;letter-spacing:.02em}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13.5px}
.menu button:hover{background:#F4F2EC}
.menu button[aria-pressed=true]{background:var(--pt-soft);color:var(--pt);font-weight:600}
.menu button small{display:block;color:var(--tx-3);font-size:12px;margin-top:1px}

.ctl-r{position:fixed;top:calc(var(--top) + 12px);right:12px;z-index:5;width:226px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r2);box-shadow:var(--shadow);padding:10px}
.ctl-r h4{font-size:11.5px;color:var(--tx-3);font-weight:600;margin:10px 4px 4px;letter-spacing:.02em}
.ctl-r h4:first-child{margin-top:2px}
.tg{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 6px;border-radius:7px;font-size:13.5px;text-align:left}
.tg:hover{background:#F4F2EC}
.tg .bx{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center}
.tg[aria-pressed=true] .bx{background:var(--pt);border-color:var(--pt)}
.tg[aria-pressed=true] .bx::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;background:#F1EFE9;border-radius:9px;padding:3px}
.three button{border:0;background:none;padding:7px 0;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--tx-2)}
.three button[aria-pressed=true]{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.row2 .tbtn{margin-top:0;padding:0 6px;font-size:12.5px}
.tg small{font-weight:400;font-size:11.5px}
.readme{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 102px);z-index:4;background:rgba(255,255,255,.94);border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;font-size:13px;box-shadow:var(--shadow);max-width:min(620px,calc(100vw - 700px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.readme b{color:var(--pt)}
.glance{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:6px}
.glance h3{margin:0;padding:14px 16px 4px;font-size:16px;letter-spacing:-.01em}
.glance .why{padding:0 16px 12px;font-size:13px;line-height:1.6;color:var(--tx-2);margin:0}
.gl-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.gl-grid button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);text-align:left;padding:12px 14px;min-height:96px}
.gl-grid button:nth-child(2n){border-right:0}.gl-grid button:nth-last-child(-n+2){border-bottom:0}
.gl-grid button:hover{background:#F7F5F0}
.gl-grid b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;color:#8A3E14}
.gl-grid b.g{color:var(--pt)}
.gl-grid span{display:block;font-size:12.5px;line-height:1.45;color:var(--tx);margin-top:3px}
.gl-grid em{display:block;font-style:normal;font-size:12px;color:var(--pt);margin-top:5px;font-weight:600}
.zone-box{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--pt-line);background:var(--pt-soft);border-radius:var(--r1);padding:9px 12px;font-size:13.5px;margin-top:12px}
.zone-box b{font-weight:700}
.tl-bar.pred i{background:repeating-linear-gradient(135deg,#D8D3C6 0 4px,#EFEBE2 4px 8px)}
.tl-bar.pred[aria-pressed=true] i{background:repeating-linear-gradient(135deg,#23704A 0 4px,#5E9C7C 4px 8px)}
.tl-bar.pred span::after{content:" 예측";font-size:10.5px;color:var(--tx-3)}
.fc{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-top:4px;background:#FCFBF8}
.fc p{margin:6px 0 0;font-size:14px;line-height:1.6}
.fc .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.fc .warn{color:#8A3E14;font-weight:700}
.simbtn{width:100%;height:46px;margin-top:12px;border-radius:var(--r1);border:1px solid #8A3E14;background:#FFF7F1;color:#8A3E14;font-weight:700;font-size:14.5px}
.simbtn:hover{background:#8A3E14;color:#fff}
.sim{border:2px solid #8A3E14;border-radius:var(--r2);padding:14px;margin-top:12px;background:#FFFCF9}
.sim h4{margin:0 0 8px;font-size:15px;color:#8A3E14}
.sim .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sim .row3 div{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.sim .row3 b{display:block;font-size:18px}
.sim .row3 small{font-size:11.5px;color:var(--tx-2)}
.sim-leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx-2);margin-top:6px}
.sim-leg i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#2E8B57,#E3AE80,#B03A1A)}
.simbar{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:8;background:#8A3E14;color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;box-shadow:var(--float);display:none;align-items:center;gap:12px}
.simbar.on{display:flex}
.simbar button{border:0;background:#fff;color:#8A3E14;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px}
.ctl-r .tbtn{width:100%;justify-content:center;margin-top:8px}
.kleg{display:flex;flex-wrap:wrap;gap:4px 10px;padding:2px 6px 4px;font-size:12px;color:var(--tx-2)}
.kleg span{display:inline-flex;align-items:center;gap:5px}
.kleg i{width:9px;height:9px;border-radius:50%;display:inline-block}

.legend{position:fixed;left:420px;bottom:94px;z-index:5;background:rgba(255,255,255,.95);border:1px solid var(--line-2);border-radius:var(--r2);padding:10px 12px;box-shadow:var(--shadow);width:310px}
.legend .t{font-size:12.5px;font-weight:600;margin-bottom:6px}
.legend .t small{font-weight:500;color:var(--tx-3);margin-left:4px}
.lg-bar{display:flex;gap:2px}
.lg-bar i{flex:1;height:10px}
.lg-bar i:first-child{border-radius:3px 0 0 3px}.lg-bar i:last-child{border-radius:0 3px 3px 0}
.lg-lab{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;font-size:12px;color:var(--tx-2);margin-top:4px}
.lg-lab span{white-space:nowrap;overflow:hidden;text-overflow:clip}
.lg-rng{font-size:12px;color:var(--tx-2);margin-top:3px}

/* =========================================================

const RAMP = {
  green: ['#E9F2EB', '#C3DECB', '#8EC3A0', '#4F9D6F', '#1F6B45'],
  warm: ['#F8EFE5', '#F0D5B8', '#E3AE80', '#CD7C45', '#9E4E1C'],
};

function barsSvg(vals, labels, { w = 360, h = 120, color = '#23704A', unit = '', predFrom = 99 } = {}) {

  <line x1="0" x2="${w}" y1="${h + pad}" y2="${h + pad}" stroke="#D6D1C4"/>
  <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#F3EFE6"/><rect width="2.2" height="5" fill="${color}" opacity=".55"/></pattern></defs>

      new deck.ArcLayer({ id: 'sim-arc', data: pts.filter((q) => q.w > wmax * 0.05), getSourcePosition: (q) => q.p,
        getTargetPosition: (q) => [q.p[0] + (q.to.lon - q.p[0]) * e, q.p[1] + (q.to.lat - q.p[1]) * e],
        getSourceColor: (q) => [...color(q.d1), 90], getTargetColor: (q) => [...color(q.d1), 230], getWidth: (q) => 1 + 3 * Math.sqrt(q.w / wmax), getHeight: 0.5, widthUnits: 'pixels', updateTriggers: { getTargetPosition: e } }),
      new deck.ScatterplotLayer({ id: 'sim-closed', data: [s], getPosition: (x) => [x.lon, x.lat], getRadius: 14, radiusUnits: 'pixels', getFillColor: [255, 255, 255, 230], getLineColor: [176, 58, 26, 255], lineWidthMinPixels: 4, stroked: true }),
      new deck.ScatterplotLayer({ id: 'sim-recv', data: rv.slice(0, 4), getPosition: (r) => [r.o.lon, r.o.lat], getRadius: (r) => 9 + 12 * Math.sqrt(share(r)), radiusUnits: 'pixels', getFillColor: [35, 112, 74, 255], getLineColor: [255, 255, 255, 255], lineWidthMinPixels: 2, stroked: true }),
    ] });
    if (t < 1) simRaf = requestAnimationFrame(frame);
  };
  simRaf = requestAnimationFrame(frame);
}
function stopSim() {
  cancelAnimationFrame(simRaf); simState = null;
  if (S.simFlat) { S.simFlat = false; if (map) paint(); }
  if (deckOverlay) deckOverlay.setProps({ layers: [] });
  $('#simbar').classList.remove('on');
  const o = $('#simOut'); if (o) o.innerHTML = '';
}

/* ---------- 모바일 시트 ---------- */
function openSheet() { if (!MOBILE) return; const p = $('#panel'); p.classList.remove('min'); document.body.classList.remove('sheet-min'); }
$('#handle').addEventListener('click', () => {
  const p = $('#panel');
  if (p.classList.contains('full')) { p.classList.remove('full'); p.classList.add('min'); }
  else if (p.classList.contains('min')) { p.classList.remove('min'); }
  else p.classList.add('full');
  document.body.classList.toggle('sheet-min', p.classList.contains('min'));
  document.body.classList.toggle('sheet-full', p.classList.contains('full'));
});

/* =========================================================
   시연(드론 투어)
   ========================================================= */
let touring = false, tourIdx = 0, tourTimer = null, tourT0 = 0, tourRaf = null, tourYearT = null;
const TOUR = ['decline', 'forecast', 'future', 'small', 'mountain', 'closed'];
const TOUR_MS = 11000;
function startTour() {
  touring = true; document.body.classList.add('touring'); $('#tour').classList.add('on');
  if (S.view === '2d' && !MOBILE) { S.view = 'bar'; applyView(); }
  map.resize(); tourIdx = 0; tourStep();
}
function tourStep() {
  clearTimeout(tourTimer);
  const st = STORIES.find((x) => x.id === TOUR[tourIdx]);
  openStory(st.id, false);
  const cam = storyCam(st);
  map.flyTo({ ...cam, duration: 3200, essential: true });
  map.once('moveend', () => { if (touring && pitched()) map.easeTo({ bearing: cam.bearing + 20, duration: TOUR_MS - 3400, easing: (t) => t }); });
  const h = st.hero();
  $('#tK').textContent = `${tourIdx + 1} / ${TOUR.length} · ${st.g}`;
  $('#tH').textContent = st.q;
  const tmp = document.createElement('div'); tmp.innerHTML = st.body(); const firstP = tmp.querySelector('p');
  $('#tP').innerHTML = `<b>${h.l}: ${h.v.replace(/<[^>]+>/g, '')}</b><br>${firstP ? firstP.innerHTML : ''}`;
  tourT0 = performance.now();
  cancelAnimationFrame(tourRaf);
  const bar = () => { const t = Math.min(1, (performance.now() - tourT0) / TOUR_MS); $('#tBar').style.width = t * 100 + '%'; if (touring && t < 1) tourRaf = requestAnimationFrame(bar); };
  bar();
  clearTimeout(tourYearT);
  if (st.ind === 'change' || st.ind === 'smallShare') { setYear(st.ind === 'change' ? 1 : 0, false); tourYearT = setTimeout(() => touring && setYear(4, true), 3600); }
  if (st.play) { setFutureYear(0, false); let k = 0; const adv = () => { if (!touring || S.story !== st) return; k++; if (k > 10) return; setFutureYear(k); tourYearT = setTimeout(adv, 700); }; tourYearT = setTimeout(adv, 2600); }
  tourTimer = setTimeout(() => { tourIdx = (tourIdx + 1) % TOUR.length; tourStep(); }, TOUR_MS);
}
function stopTour() {
  touring = false; clearTimeout(tourTimer); clearTimeout(tourYearT); cancelAnimationFrame(tourRaf); map.stop();
  document.body.classList.remove('touring'); $('#tour').classList.remove('on'); map.resize();
}

/* =========================================================
   자료·방법
   ========================================================= */
function renderAbout() {
  const m = D.stats.meta;
  $('#aboutBox').innerHTML = `<button class="x" data-act="about-x" aria-label="닫기">×</button><h3 id="aboutT">자료와 계산 방법</h3>
  <p>경상북도 초등학교·중학교·고등학교·특수학교(분교장 포함, 폐교 제외) <b>${fmt(D.schools.length)}곳</b>의 공개 통계를 모았습니다. 유치원, 각종학교, 방송통신중·고는 넣지 않았습니다. 군위군은 2023년 대구로 편입돼 5년 모두에서 뺐습니다.</p>
  <h4>출처</h4><ul>${m.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a> · ${esc(s.date)}</li>`).join('')}<li>급식·학사일정: 나이스 교육정보 개방 포털 Open API (학교 카드를 열 때 실시간 조회)</li><li>배경 지도: OpenFreeMap · OpenStreetMap 기여자 / 지형: Mapzen Terrain Tiles(AWS)</li></ul>
  <h4>숫자 확인</h4><p>변환 뒤 KESS 원자료 엑셀을 다시 더해 연도별 경북 학생·학급·교원 합계와 22개 시군 학생 합계가 지도 자료와 <b>모두 일치</b>하는지 대조했습니다(2022~2026).</p>
  <h4>지표 정의</h4><ul>
  <li>학생 수 증감률: 2022년 4월 1일 대비 선택 연도 4월 1일 재학생 수 변화. 학교 카드에서 이름이 바뀐 학교(22곳)는 옛 이름·같은 도로명 주소로 지난 기록을 이어 붙였습니다(한 주소에 같은 학교급이 둘인 곳은 잇지 않음). 읍면동 증감률은 2022→2026 고정이며 2022년 학교를 위치나 주소로 읍면동에 배정했습니다(배정 못 한 학생 ${fmt(m.s22Lost)}명).</li>
  <li>소규모학교: 학생 60명 이하(분교 포함, 특수학교 제외). 교육부 적정규모 권고 기준 가운데 면·도서벽지 기준을 모든 지역에 똑같이 적용했습니다.</li>
  <li>신입생 0명: KESS 「입학자」가 0인 초·중·고.</li>
  <li>교원 1인당 학생 수: 학생 수 ÷ (정규 + 기간제 교원).</li>
  <li>특수교육 대상 학생: 일반학교 특수학급 학생 + 특수학교 재학생. 특수학급 수에는 특수학교 학급을 넣지 않았습니다.</li>
  <li>통학 거리: 읍면동 대표점에서 가장 가까운 학교까지 직선거리(휴교 제외). 도로 거리가 아닙니다.</li>
  <li>도서벽지: 법령 별표의 경북 학교 ${m.bjTotal}곳 중 운영 중인 ${D.schools.filter((s) => s.bj).length}곳. 별표에 있으나 이미 폐교된 곳: ${m.bjClosed.map((b) => esc(b.name)).join(', ')}. 경북교육청 인사 가산점 급지표와는 다릅니다.</li>
  <li>입학생 전망: 행정동별 주민등록 0~2세 ÷ 6~8세 − 1(${esc(m.popMonth)} 말). 전입·전출, 사립·특수학교 진학은 반영하지 않은 단순 비교입니다.</li>
  <li>통학구역: 학구도안내시스템 경계에서 학교 위치가 들어가는 구역을 찾았습니다(초 466/474곳, 중 259/260곳 연결). 공동통학구역은 여러 학교가 함께 씁니다. 법적 효력은 없습니다.</li>
  <li>5년 뒤 예측(초·중): 학구 경계와 행정동이 겹치는 면적 비율로 학구 안 나이별 인구를 추정하고, 2026년 실제 1학년 ÷ 같은 출생 연도 인구를 그 학교로 오는 비율로 삼아 2027~2032년 입학생을 계산했습니다. 학년이 올라갈 때 줄거나 느는 비율은 학교의 2025→2026 값을 시군 값 쪽으로 당겨 썼습니다. 중학교 입학생은 중학구 안 초등학교 6학년 예측에서 이어 계산했습니다. 학교 신설·재배치 계획과 앞으로의 전입·전출 변화는 반영하지 않은 단순 추정입니다.</li>
  <li>통폐합 시뮬레이션: 학구 안을 격자로 나누고 칸마다 읍면동 아이 수(초 6~11세, 중 12~14세)를 면적 비율로 나눠 실은 뒤, 가장 가까운 다른 같은 급 학교까지 직선거리를 비교했습니다. 3D 곡선은 deck.gl로 그렸습니다.</li>
  <li>해발 고도: AWS Terrain Tiles(z12) 지형 값. 지형 보기에서는 산 높이를 실제의 2.8배로 키워 보여 줍니다.</li>
  <li>인구감소지역: 안동·영주·영천·상주·문경·의성·청송·영양·영덕·청도·고령·성주·봉화·울진·울릉(15곳), 관심지역: 경주·김천.</li></ul>
  <h4>한계</h4><ul>
  <li>폐교 재산은 표준데이터에 좌표가 없어 읍면 대표점 둘레에 놓았습니다. 구미·성주 교육지원청 자료는 표준데이터에 없습니다.</li>
  <li>학교 위치는 한국교육시설안전원 자료를 쓰고, 없는 21곳은 옛 이름·같은 주소·OpenStreetMap으로 찾았습니다. 이 가운데 2곳(안동영명학교·경북영광학교)은 읍면 대표점입니다.</li>
  <li>KESS 통계는 공표 후 바뀌지 않는 조사 자료라 학교알리미 공시 숫자와 조금 다를 수 있습니다.</li></ul>
  <p class="small muted">자료 만든 날: ${esc(m.builtAt.slice(0, 10))}</p>`;
}

/* =========================================================
   주소 공유(해시)
   ========================================================= */
function syncHash() {
  if (touring) return;
  const p = new URLSearchParams();
  p.set('i', S.ind); if (S.level !== 'sigun') p.set('lv', S.level); if (S.kind !== 'all') p.set('k', S.kind); if (S.yi !== 4) p.set('y', YEARS[S.yi]);
  if (S.school !== null) p.set('s', D.schools[S.school].id || D.schools[S.school].name);
  else if (S.sigun) p.set('sg', S.sigun);
  else if (S.story) p.set('q', S.story.id);
  history.replaceState(null, '', '#' + p.toString());
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('i') && IND[p.get('i')]) S.ind = p.get('i');
  if (p.get('lv')) S.level = p.get('lv');
  if (p.get('k') && KIND_KEYS.includes(p.get('k'))) S.kind = p.get('k');
  if (p.get('y')) { const y = YEARS.indexOf(+p.get('y')); if (y >= 0) S.yi = y; }
  return p;
}

/* =========================================================
   이벤트 연결
   ========================================================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, li[data-sg], li[data-emd], tr[data-sg], tr[data-kind]');
  if (!t || !t.closest('#inddd')) { $('#inddd').classList.remove('open'); document.body.classList.remove('menu-open'); }
  if (!t) return;
  const d = t.dataset;
  if (t.id === 'indBtn') { $('#inddd').classList.toggle('open'); document.body.classList.toggle('menu-open', $('#inddd').classList.contains('open')); return; }
  if (d.ind) { S.ind = d.ind; if (!IND[S.ind].lv.includes(S.level)) S.level = IND[S.ind].lv[0]; $('#inddd').classList.remove('open'); document.body.classList.remove('menu-open'); paint(); if (S.story) renderStory(); return; }
  if (d.lv && !t.disabled) { S.level = d.lv; S.sigun = null; S.emd = null; map.setFilter('sel-line', ['==', ['get', 'sigun'], '']); map.setFilter('emd-hover', ['==', ['get', 'code'], '']); paint(); renderPanel(); return; }
  if (d.k) { S.kind = d.k; paint(); applySchoolFilter(); if (S.story || S.tab === 'r') renderPanel(); return; }
  if (d.kind) { S.kind = d.kind; paint(); applySchoolFilter(); return; }
  if (d.v) { const was = S.view; S.view = d.v; applyView(); if (d.v === '3d' && was !== '3d' && S.school === null && !S.story) flyMountain(); return; }
  if (d.l) { S.layers[d.l] = !S.layers[d.l]; applyView(); applySchoolFilter(); renderLegend(); return; }
  if (d.y !== undefined && t.classList.contains('tl-bar')) { stopPlay(); setYear(+d.y); return; }
  if (d.fy !== undefined && t.classList.contains('tl-bar')) { stopPlay(); setFutureYear(+d.fy); return; }
  if (d.tab) { setTab(d.tab); return; }
  if (d.story) { openStory(d.story); return; }
  if (d.sim !== undefined) { runSim(+d.sim); return; }
  if (d.sch !== undefined) { stopSim(); openSchool(+d.sch); return; }
  if (d.schname) { const s = D.schools.find((x) => x.name === d.schname && (!d.schsg || x.sigun === d.schsg)); if (s) openSchool(s.i); return; }
  if (d.closed !== undefined) { openClosed(+d.closed); return; }
  if (d.sg) { openSigun(d.sg); return; }
  if (d.emd) { if (S.level !== 'emd' && !IND[S.ind].lv.includes('emd')) S.ind = 'nearM'; S.level = 'emd'; paint(); openEmd(d.emd); return; }
  if (d.act === 'qlist') { S.story = null; setFilter(null); S.layers.closed = false; applyView(true); renderPanel(); syncHash(); return; }
  if (d.act === 'close') { // 한 단계씩 뒤로: 학교 → 폐교 → 읍면동 → 시군
    if (S.school !== null) { S.school = null; selectSchool(-1); stopSim(); }
    else if (S.closedSel !== null && S.closedSel !== undefined) S.closedSel = null;
    else if (S.emd) { S.emd = null; map.setFilter('emd-hover', ['==', ['get', 'code'], '']); }
    else if (S.sigun) { S.sigun = null; map.setFilter('sel-line', ['==', ['get', 'sigun'], '']); }
    renderPanel(); syncHash(); return; }
  if (d.act === 'more') { SQ.n += 100; renderSearch(); return; }
  if (d.act === 'sclear') { Object.assign(SQ, { q: '', sg: '', k: '', cond: '', n: 60 }); pbody.innerHTML = ''; renderSearch(); return; }
  if (d.act === 'about-x') { $('#about').classList.remove('on'); return; }
  if (t.id === 'play') { togglePlay(); return; }
  if (t.id === 'btnReset') { goHome(); return; }
  if (t.id === 'btnUlleung') { map.flyTo({ center: [131.2, 37.42], zoom: 9.4, pitch: pitched() ? 50 : 0, bearing: 0, duration: 1800 }); return; }
  if (t.id === 'home') { stopTour(); setTab('q'); S.ind = 'change'; S.level = 'sigun'; S.kind = 'all'; S.yi = 4; setFilter(null); S.layers.closed = false; S.layers.bj = false; applyView(true); paint(); map.getSource('sch-col').setData(schoolColumns()); map.getSource('sch-pt').setData(schoolPoints()); goHome(); return; }
  if (t.id === 'simStop') { stopSim(); return; }
  if (t.id === 'btnTour') { touring ? stopTour() : startTour(); return; }
  if (t.id === 'tStop') { stopTour(); return; }
  if (t.id === 'tNext') { tourIdx = (tourIdx + 1) % TOUR.length; tourStep(); return; }
  if (t.id === 'tPrev') { tourIdx = (tourIdx - 1 + TOUR.length) % TOUR.length; tourStep(); return; }
  if (t.id === 'btnAbout') { renderAbout(); $('#about').classList.add('on'); return; }
});
$('#about').addEventListener('click', (e) => { if (e.target.id === 'about') $('#about').classList.remove('on'); });
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('li[data-sg], li[data-emd], tr[data-sg], tr[data-kind]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape') { if ($('#about').classList.contains('on')) $('#about').classList.remove('on'); else if (touring) stopTour(); else $('#inddd').classList.remove('open'); }
  if (touring && e.key === 'ArrowRight') { tourIdx = (tourIdx + 1) % TOUR.length; tourStep(); }
  if (touring && e.key === 'ArrowLeft') { tourIdx = (tourIdx - 1 + TOUR.length) % TOUR.length; tourStep(); }
});

/* ---------- 시작 ---------- */
(async () => {
  try { await load(); } catch (e) { $('#loading').textContent = '자료를 불러오지 못했습니다. 새로고침해 주세요.'; return; }
  const p = readHash();
  initMap();
  // 지도 레이어가 준비되면(setupLayers 끝) 한 번 실행 — 'load' 이벤트 순서에 기대지 않는다
  routeInitial = () => {
    if (p.get('s')) { const s = D.schools.find((x) => x.id === p.get('s') || x.name === p.get('s')); if (s) { setTab('s'); openSchool(s.i); } }
    else if (p.get('sg') && D.stats.sigun[p.get('sg')]) openSigun(p.get('sg'));
    else if (p.get('q')) openStory(p.get('q'));
    else renderPanel();
  };
  if (layersReady) routeInitial();
  if (MOBILE) { $('#panel').classList.add('min'); document.body.classList.add('sheet-min'); }
})();
</script>
